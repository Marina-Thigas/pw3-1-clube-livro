@for(livro of (listaLivros | async); track livro.id)
{
    <mat-card class="card-livro">
        <mat-card-header class="titulo-card-livro">
            {{livro.titulo}}
        </mat-card-header>
        <mat-card-content>
            <p>Dono: {{livro.dono}}</p>
            <p>Status: {{livro.status}}</p>
            <p>Data de empréstimo: {{livro.dataEmprestimo}}</p>
            <p>Data de devolução prevista: {{livro.dataDevolucaoPrevista}}</p>

            <button mat-raised-button (click)="deletar(livro.id)">Excluir</button>
            <button mat-raised-button routerLink="detalhes/{{livro.id}}">Ver detalhes</button>
        </mat-card-content>
    </mat-card>
    
}
